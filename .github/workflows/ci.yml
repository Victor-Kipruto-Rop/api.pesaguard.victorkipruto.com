name: PesaGuard CI

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pesaguard
          POSTGRES_PASSWORD: pesaguard
          POSTGRES_DB: pesaguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libpq-dev gcc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.4
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pesaguard_backend_pipeline/requirements.txt ]; then
            pip install -r pesaguard_backend_pipeline/requirements.txt
          else
            pip install Flask==3.1.0 SQLAlchemy==2.0.38 psycopg2-binary==2.9.10 redis==5.2.1 rq==2.1.0 pytest==8.3.4 requests==2.32.3 PyJWT==2.10.1
          fi

      - name: Compile Python modules
        run: python -m compileall -q pesaguard_backend_pipeline

      - name: Run test suite
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://pesaguard:pesaguard@localhost:5432/pesaguard_test
          REDIS_URL: redis://localhost:6379/0
          DARAJA_SHARED_SECRET: test_ci_secret_key_12345
          PESAGUARD_ALLOW_UNRESTRICTED_WEBHOOK_SOURCE: 1
          JWT_SECRET_KEY: test_ci_jwt_secret_key_12345
        run: |
          pytest -v --tb=short --durations=10

      - name: Run frontend tests (if applicable)
        run: |
          if [ -f frontend/package.json ]; then
            npm --prefix frontend ci
            npm --prefix frontend test -- --watchAll=false
          fi
        continue-on-error: true
