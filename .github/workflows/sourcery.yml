name: Sourcery AI Review

on:
  pull_request:
    branches: [main, develop]

jobs:
  sourcery-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Sourcery review
        uses: sourcery-ai/action@v1
        with:
          token: ${{ secrets.SOURCERY_TOKEN }}
          python-version: '3.12'
