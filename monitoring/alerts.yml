groups:
  - name: pesaguard-data-pipeline
    rules:
      - alert: PesaGuardTransactionOutboxBacklog
        expr: pesaguard_transaction_outbox_pending > 1000
        for: 10m
        labels:
          severity: critical
          service: ingestion
        annotations:
          summary: Transaction outbox backlog is growing
          description: More than 1000 transaction publication intents are pending or retrying.

      - alert: PesaGuardReconciliationOutboxBacklog
        expr: pesaguard_reconciliation_outbox_pending > 1000
        for: 10m
        labels:
          severity: critical
          service: reconciliation
        annotations:
          summary: Reconciliation result outbox backlog is growing
          description: More than 1000 reconciliation results await publication or retry.

      - alert: PesaGuardReconciliationProcessingStuck
        expr: pesaguard_reconciliation_processing > 0
        for: 30m
        labels:
          severity: warning
          service: reconciliation
        annotations:
          summary: Reconciliation records remain in processing state
          description: Reconciliation processing state has not drained for 30 minutes; inspect worker health and database locks.

      - alert: PesaGuardDeadLetterGrowth
        expr: pesaguard_dead_letters_total > 100
        for: 5m
        labels:
          severity: warning
          service: ingestion
        annotations:
          summary: Dead-letter volume is elevated
          description: More than 100 dead-letter records currently require operator attention.

      - alert: PesaGuardBackupStale
        expr: pesaguard_backup_age_seconds > 93600
        for: 30m
        labels:
          severity: critical
          service: backup
        annotations:
          summary: PesaGuard database backup is stale
          description: The newest verified backup is older than 26 hours; inspect backup job and off-site delivery.
