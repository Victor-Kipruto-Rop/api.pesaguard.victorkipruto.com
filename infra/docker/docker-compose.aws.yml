services:
  webhook_receiver:
    ports: []

  dashboard_api:
    ports: []

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dashboard_api
      - webhook_receiver
    ports:
      - "127.0.0.1:8080:8080"
    expose:
      - "8080"
