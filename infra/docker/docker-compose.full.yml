version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pesaguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: pesaguard
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: python pesaguard_backend_pipeline/app.py
    environment:
      DATABASE_URL: postgresql://pesaguard:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/pesaguard
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - kafka

  dashboard:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: python -m pesaguard_backend_pipeline.canonical_app
    environment:
      DATABASE_URL: postgresql://pesaguard:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/pesaguard
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
    depends_on:
      - postgres

volumes:
  pgdata:
