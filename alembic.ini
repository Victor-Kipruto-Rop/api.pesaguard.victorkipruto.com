# Alembic Migration Engine Configuration for PesaGuard
# Supported Database URL Scheme: postgresql://user:pass@host:port/dbname

[alembic]
script_location = pesaguard_backend_pipeline/alembic
# Default database URL fallback for migrations. 
# Replaced dynamically by env:DATABASE_URL in env.py when present.
sqlalchemy.url = postgresql://pesaguard:pesaguard@localhost:5432/pesaguard

# File naming template for generated migration revisions
# Format: YYYYMMDD_slug.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(slug)s

# Set to 'true' to run the environment during the 'revision' command
# to generate autogenerated migrations.
prepend_sys_path = .
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
