name: Web checks
on:
  push:
    paths: ["pesaguard-web/**"]
  pull_request:
    paths: ["pesaguard-web/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pesaguard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
            cache: npm
          - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
